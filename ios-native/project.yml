name: WhoopCompanion
options:
  bundleIdPrefix: app.lovable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  WhoopCompanion:
    type: application
    platform: iOS
    sources:
      - path: WhoopCompanion
    resources:
      - path: WhoopCompanion/Assets.xcassets
    info:
      path: WhoopCompanion/Info.plist
      properties:
        CFBundleDisplayName: Cove
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: "Cove uses the camera so you can snap a photo of your meal and let AI estimate its macros, or scan a product barcode."
        NSPhotoLibraryUsageDescription: "Cove accesses your photo library so you can pick a meal photo and let AI estimate its macros."
        NSCameraUsageDescription: "Cove uses the camera so you can snap a photo of your meal and let AI estimate its macros, or scan a product barcode."
        NSPhotoLibraryUsageDescription: "Cove accesses your photo library so you can pick a meal photo and let AI estimate its macros."
        NSHealthShareUsageDescription: "Cove reads HRV, resting heart rate, sleep, weight, and water from Apple Health to auto-fill your daily log so you don't have to type it."
        NSHealthUpdateUsageDescription: "Cove writes weight and water back to Apple Health so your data stays in sync."
        CFBundleURLTypes:
          - CFBundleURLName: app.lovable.cove
            CFBundleURLSchemes:
              - cove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lovable.whoopcompanion
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "$(inherited)"
    dependencies:
      - package: Supabase
        product: Supabase

  WhoopCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhoopCompanionTests
    dependencies:
      - target: WhoopCompanion
