name: WhoopCompanion
options:
  bundleIdPrefix: com.neelrawat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  WhoopCompanion:
    type: application
    platform: iOS
    sources:
      - path: WhoopCompanion
    resources:
      - path: WhoopCompanion/Assets.xcassets
      - path: WhoopCompanion/Resources/Fonts/Fraunces-Regular.ttf
      - path: WhoopCompanion/Resources/Fonts/DMSans-Regular.ttf
    info:
      path: WhoopCompanion/Info.plist
      properties:
        CFBundleDisplayName: Cove
        UIAppFonts:
          - Fraunces-Regular.ttf
          - DMSans-Regular.ttf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: "Cove uses the camera so you can snap a photo of your meal and let AI estimate its macros, or scan a product barcode."
        NSPhotoLibraryUsageDescription: "Cove accesses your photo library so you can pick a meal photo and let AI estimate its macros."
        NSFaceIDUsageDescription: "Cove uses Face ID to keep your health data private when you open the app."
        NSHealthShareUsageDescription: "Cove reads HRV, resting heart rate, sleep, weight, water, height, birth date and sex from Apple Health to auto-fill your daily log so you don't have to type it."
        CFBundleURLTypes:
          - CFBundleURLName: com.neelrawat.cove
            CFBundleURLSchemes:
              - cove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neelrawat.cove
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "$(inherited)"
        CODE_SIGN_ENTITLEMENTS: WhoopCompanion/WhoopCompanion.entitlements
    dependencies:
      - package: Supabase
        product: Supabase

  WhoopCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhoopCompanionTests
    dependencies:
      - target: WhoopCompanion
