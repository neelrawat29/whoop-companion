name: WhoopCompanion
options:
  bundleIdPrefix: app.lovable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  WhoopCompanion:
    type: application
    platform: iOS
    sources:
      - path: WhoopCompanion
    resources:
      - path: WhoopCompanion/Assets.xcassets
    info:
      path: WhoopCompanion/Info.plist
      properties:
        CFBundleDisplayName: Cove
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lovable.whoopcompanion
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "$(inherited)"
    dependencies:
      - package: Supabase
        product: Supabase

  WhoopCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhoopCompanionTests
    dependencies:
      - target: WhoopCompanion
